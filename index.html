<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统计模拟器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: Georgia, "Songti SC", "PingFang SC", "Microsoft YaHei", serif;
    background: #2d4a3e; color: #f0ebdd;
    overflow: hidden; font-size: 16px;
  }
  #app { display: flex; width: 100vw; height: 100vh; }
  #main { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 20px 28px; }
  #tabs { display: flex; gap: 6px; justify-content: center; padding: 6px 0 16px; border-bottom: 1px solid #3d5a4d; width: 100%; max-width: 1140px; }
  .tab { padding: 10px 24px; font-size: 17px; color: #a8b8ad; cursor: pointer; border: none; background: none; border-radius: 4px; transition: all .18s; font-family: inherit; letter-spacing: .5px; }
  .tab:hover { background: #3d5a4d; color: #f0ebdd; }
  .tab.active { background: #d4c89a; color: #1e3328; font-weight: 600; }
  #viewSwitch { display: flex; gap: 6px; justify-content: center; align-items: center; padding: 14px 0; width: 100%; max-width: 1140px; }
  .view-btn { padding: 8px 22px; font-size: 15px; border-radius: 4px; border: 1px solid #4a6b5b; background: transparent; color: #a8b8ad; cursor: pointer; transition: all .18s; font-family: inherit; }
  .view-btn:hover { border-color: #d4c89a; color: #f0ebdd; }
  .view-btn.active { background: #d4c89a; color: #1e3328; border-color: #d4c89a; }

  #chartHistoryBar { display: none; gap: 6px; justify-content: center; align-items: center; padding: 8px 0 12px; width: 100%; max-width: 1140px; flex-wrap: wrap; }
  #chartHistoryBar.active { display: flex; }
  .chart-hist-btn { padding: 6px 14px; font-size: 13px; border-radius: 4px; border: 1px solid #4a6b5b; background: transparent; color: #a8b8ad; cursor: pointer; transition: all .15s; font-family: inherit; }
  .chart-hist-btn:hover { border-color: #d4c89a; color: #f0ebdd; }
  .chart-hist-btn.active { background: #d4c89a; color: #1e3328; border-color: #d4c89a; }

  #canvasWrap { flex: 1; position: relative; width: 100%; max-width: 1140px; background: #f0ebdd; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  canvas { display: block; width: 100%; height: 100%; }
  #tooltip { position: absolute; pointer-events: none; background: rgba(30,51,40,.95); color: #f0ebdd; font-size: 14px; line-height: 1.6; padding: 10px 14px; border-radius: 4px; white-space: nowrap; opacity: 0; transition: opacity .12s; z-index: 10; }
  #controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; padding: 16px 0 4px; width: 100%; max-width: 1140px; font-size: 15px; color: #a8b8ad; }
  button { padding: 9px 20px; border-radius: 4px; border: 1px solid #d4c89a; background: #d4c89a; color: #1e3328; cursor: pointer; font-size: 15px; transition: all .15s; font-family: inherit; font-weight: 500; }
  button:hover { background: #c4b78a; }
  button.ghost { background: transparent; color: #d4c89a; }
  button.ghost:hover { background: rgba(212,200,154,.12); }
  button.danger { background: #8fa39b; border-color: #8fa39b; color: #1e3328; }
  button.danger:hover { background: #7e928a; }

  #side { width: 320px; background: #233d33; border-left: 1px solid #3d5a4d; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  #sideHeader { padding: 18px 20px 12px; border-bottom: 1px solid #3d5a4d; }
  #sideHeader h3 { font-size: 16px; font-weight: 600; color: #d4c89a; font-family: inherit; letter-spacing: .5px; margin-bottom: 10px; }
  #sideHeader .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #a8b8ad; }
  #sideHeader label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #d4c89a; font-size: 13px; }
  #sideHeader input[type=checkbox] { width: 15px; height: 15px; accent-color: #d4c89a; cursor: pointer; }
  #history { flex: 1; overflow-y: auto; padding: 12px; }
  #historyEmpty { color: #6b8577; font-size: 14px; padding: 24px 12px; text-align: center; line-height: 1.7; }
  .h-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid #3d5a4d; border-radius: 4px; margin-bottom: 10px; font-size: 14px; color: #c8d0c8; transition: all .15s; background: #1e3328; }
  .h-item:hover { border-color: #8fa39b; }
  .h-item.selected { border-color: #d4c89a; background: #2a463b; }
  .h-item input[type=checkbox] { width: 16px; height: 16px; margin-top: 3px; accent-color: #d4c89a; cursor: pointer; flex-shrink: 0; }
  .h-body { flex: 1; min-width: 0; }
  .h-title { font-weight: 600; color: #f0ebdd; margin-bottom: 6px; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .h-badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #3d5a4d; color: #d4c89a; font-weight: 500; }
  .h-row { display: flex; justify-content: space-between; line-height: 1.9; }
  .h-row span:last-child { color: #d4c89a; font-weight: 600; }
  .h-row .special-yes { color: #e8b88e !important; font-weight: 700; }
  .h-row .special-no { color: #8fa39b !important; }
  #compareBar { padding: 12px 16px; border-top: 1px solid #3d5a4d; }
  #compareBar button { width: 100%; font-size: 14px; padding: 8px; }

  #compareOverlay { display: none; position: absolute; inset: 0; background: #f0ebdd; padding: 20px; overflow: hidden; z-index: 20; flex-direction: column; }
  #compareOverlay.active { display: flex; }
  #compareHint { color: #7a6f5c; font-size: 14px; text-align: center; flex: 1; display: flex; align-items: center; justify-content: center; line-height: 1.8; padding: 40px; }
  #compareGrid { display: grid; gap: 16px; flex: 1; min-height: 0; grid-template-columns: 1fr; }
  #compareGrid.cols-1 { grid-template-columns: 1fr; }
  #compareGrid.cols-2 { grid-template-columns: 1fr 1fr; }
  #compareGrid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  #compareGrid.cols-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #compareGrid.cols-5, #compareGrid.cols-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .cmp-card { background: #e4dcc8; border: 1px solid #c9bfa8; border-radius: 6px; padding: 14px; border-top: 3px solid #2d4a3e; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .cmp-card h4 { font-size: 14px; margin-bottom: 8px; color: #1e3328; flex-shrink: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmp-card .badge { display: inline-block; width: 22px; height: 22px; flex-shrink: 0; line-height: 22px; text-align: center; border-radius: 50%; color: #f0ebdd; font-size: 12px; }
  .cmp-card .count-badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #c9bfa8; color: #3d3528; font-weight: 600; }
  .cmp-canvas-wrap { flex: 1; min-height: 0; position: relative; background: #f0ebdd; border-radius: 4px; }
  .cmp-card canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
  .cmp-card .cmp-stats { font-size: 13px; color: #3d3528; line-height: 1.8; margin-top: 8px; flex-shrink: 0; max-height: 100px; overflow-y: auto; }
  .cmp-card .cmp-stats b { color: #2d4a3e; }
  .cmp-card .cmp-stats .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; margin-left: 4px; }
  .cmp-card .cmp-stats .tag.yes { background: #e8b88e; color: #5c3a1e; }
  .cmp-card .cmp-stats .tag.no { background: #8fa39b; color: #1e3328; }

  .modal-mask { position: fixed; inset: 0; background: rgba(30,51,40,.7); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal-mask.hidden { display: none; }
  .modal { background: #f0ebdd; border-radius: 6px; padding: 28px 32px; min-width: 340px; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .modal h3 { font-size: 18px; color: #1e3328; margin-bottom: 8px; font-weight: 600; }
  .modal p { font-size: 14px; color: #7a6f5c; margin-bottom: 16px; line-height: 1.7; }
  .modal input[type=number] { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid #c9bfa8; border-radius: 4px; outline: none; transition: border .15s; background: #f0ebdd; color: #1e3328; font-family: inherit; }
  .modal input:focus { border-color: #2d4a3e; }
  .modal .hint { font-size: 12px; color: #7a6f5c; margin-top: 6px; }
  .modal .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; }
  .modal .actions button { border-color: #2d4a3e; background: #2d4a3e; color: #f0ebdd; }
  .modal .actions button.ghost { background: transparent; color: #2d4a3e; }
  .modal .actions button.ghost:hover { background: rgba(45,74,62,.08); }

  #guideMask { position: fixed; inset: 0; background: rgba(30,51,40,.8); display: flex; align-items: center; justify-content: center; z-index: 300; }
  #guideMask.hidden { display: none; }
  #guideBox { background: #f0ebdd; border-radius: 8px; padding: 36px; max-width: 560px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  #guideBox .guideStep { font-size: 13px; color: #7a6f5c; font-weight: 600; letter-spacing: 2px; margin-bottom: 14px; text-transform: uppercase; }
  #guideBox h2 { font-size: 24px; color: #1e3328; margin-bottom: 16px; font-weight: 600; }
  #guideBox p { font-size: 16px; line-height: 1.8; color: #3d3528; margin-bottom: 12px; }
  #guideBox .guideActions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px; }
  #guideBox .guideActions button { border-color: #2d4a3e; background: #2d4a3e; color: #f0ebdd; }
  #guideBox .guideActions button.ghost { background: transparent; color: #2d4a3e; }
  #guideBox .guideActions button.ghost:hover { background: rgba(45,74,62,.08); }
</style>
</head>
<body>

<div id="app">
  <div id="main">
    <div id="tabs">
      <button class="tab active" data-tab="buffon">蒲丰投针</button>
      <button class="tab" data-tab="galton">高尔顿钉板</button>
      <button class="tab" data-tab="birthday">生日问题</button>
      <button class="tab" data-tab="matching">分房问题</button>
    </div>
    <div id="viewSwitch">
      <button class="view-btn active" data-view="anim">过程动画</button>
      <button class="view-btn" data-view="chart">统计图表</button>
      <button class="view-btn" data-view="compare">对比视图</button>
    </div>
    <div id="chartHistoryBar"></div>
    <div id="canvasWrap">
      <canvas id="stage"></canvas>
      <div id="tooltip"></div>
      <div id="compareOverlay">
        <div id="compareHint"></div>
        <div id="compareGrid"></div>
      </div>
    </div>
    <div id="controls"></div>
  </div>
  <div id="side">
    <div id="sideHeader">
      <h3>历史记录</h3>
      <div class="row">
        <label><input type="checkbox" id="chkSelectAll">全选</label>
        <span id="historyCount">0 条</span>
      </div>
    </div>
    <div id="history"></div>
    <div id="compareBar">
      <button id="btnClearHistory" class="ghost">清空当前题目历史</button>
    </div>
  </div>
</div>

<div id="modalMask" class="modal-mask hidden">
  <div class="modal">
    <h3 id="modalTitle">输入参数</h3>
    <p id="modalDesc"></p>
    <input type="number" id="modalInput">
    <div class="hint" id="modalHint"></div>
    <div class="actions">
      <button class="ghost" id="modalCancel">取消</button>
      <button id="modalOk">确定</button>
    </div>
  </div>
</div>

<div id="guideMask">
  <div id="guideBox">
    <div class="guideStep" id="guideStepLabel">STEP 1 / 8</div>
    <h2 id="guideTitle">欢迎使用统计模拟器</h2>
    <p id="guideText"></p>
    <div class="guideActions">
      <button class="ghost" id="guideSkip">跳过</button>
      <button id="guideNext">下一步</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   基础
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = n => Math.floor(Math.random() * n);

const C = {
  bg: '#f0ebdd', bg2: '#e4dcc8', ink: '#1e3328',
  text: '#3d3528', sub: '#7a6f5c', muted: '#c9bfa8',
  accent: '#d4c89a', sage: '#8fa39b', deep: '#2d4a3e',
  red: '#a8705c', warm: '#e8b88e',
};
const CHART_COLORS = [C.deep, C.accent, C.red, C.sage, '#6b7d5e', '#8c6f5a'];

const state = {
  tab: 'buffon', view: 'anim',
  history: [], selected: [],
  recording: { buffon: false, galton: false, birthday: false, matching: false },
  chartDisplay: { buffon: 'current', galton: 'current', birthday: 'current', matching: 'current' },
};

const canvas = $('#stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resizeCanvas() {
  const rect = $('#canvasWrap').getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = rect.width; H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (sim[state.tab]) sim[state.tab].redraw();
}
window.addEventListener('resize', resizeCanvas);

const tooltip = $('#tooltip');
function showTooltip(x, y, html) {
  tooltip.innerHTML = html;
  tooltip.style.left = (x + 14) + 'px';
  tooltip.style.top = (y + 14) + 'px';
  tooltip.style.opacity = 1;
}
function hideTooltip() { tooltip.style.opacity = 0; }

/* ============================================================
   通用弹窗
   ============================================================ */
const modalMask = $('#modalMask');
const modalInput = $('#modalInput');
const modalHint = $('#modalHint');
function askNumber({ title, desc, def, min, max, step, hint }) {
  return new Promise(resolve => {
    $('#modalTitle').textContent = title;
    $('#modalDesc').textContent = desc;
    modalInput.value = def;
    modalInput.min = min;
    modalInput.max = max;
    modalInput.step = step || 1;
    modalHint.textContent = hint || '';
    modalMask.classList.remove('hidden');
    modalInput.focus();
    modalInput.select();
    function cleanup() {
      modalMask.classList.add('hidden');
      $('#modalOk').removeEventListener('click', ok);
      $('#modalCancel').removeEventListener('click', cancel);
      modalInput.removeEventListener('keydown', key);
    }
    function ok() {
      const v = parseFloat(modalInput.value);
      if (isNaN(v) || v < min || v > max) {
        modalHint.textContent = `请输入 ${min} 到 ${max} 之间的数值`;
        modalHint.style.color = C.red;
        return;
      }
      cleanup(); resolve(v);
    }
    function cancel() { cleanup(); resolve(null); }
    function key(e) {
      if (e.key === 'Enter') ok();
      if (e.key === 'Escape') cancel();
    }
    $('#modalOk').addEventListener('click', ok);
    $('#modalCancel').addEventListener('click', cancel);
    modalInput.addEventListener('keydown', key);
  });
}

/* ============================================================
   1. 蒲丰投针
   ============================================================ */
const buffon = (() => {
  const GAP = 60;
  let ratio = 0.5;
  let N = 0, hits = 0;
  let needles = [];
  let animQueue = 0;
  let lastPi = null;
  let series = [];

  function reset() {
    N = 0; hits = 0; needles = []; animQueue = 0;
    lastPi = null; series = [];
  }
  function sampleOne() {
    const l = GAP * ratio;
    const cx = rand(0, W), cy = rand(0, H);
    const theta = rand(0, Math.PI);
    const dx = Math.cos(theta) * l / 2;
    const dy = Math.sin(theta) * l / 2;
    const x1 = cx - dx, y1 = cy - dy;
    const x2 = cx + dx, y2 = cy + dy;
    let hit = false;
    for (let y = GAP; y < H; y += GAP) {
      const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
      if (minY <= y && y <= maxY) { hit = true; break; }
    }
    return { x1, y1, x2, y2, hit };
  }
  function throwAnim() {
    const s = sampleOne();
    N++; if (s.hit) hits++;
    if (hits > 0) lastPi = 2 * ratio * N / hits;
    needles.push({ ...s, n: N, ratio });
    if (needles.length > 800) needles.shift();
  }
  function throwBatch(k) {
    for (let i = 0; i < k; i++) {
      const s = sampleOne();
      N++; if (s.hit) hits++;
      needles.push({ ...s, n: N, ratio });
      if (needles.length > 500) needles.shift();
    }
    if (hits > 0) lastPi = 2 * ratio * N / hits;
    series.push({ N, pi: lastPi });
  }
  function stepAnim(k) { animQueue += k; }
  function updateAnim() {
    if (animQueue > 0) {
      const batch = Math.min(animQueue, 5);
      for (let i = 0; i < batch; i++) throwAnim();
      animQueue -= batch;
      if (animQueue === 0) series.push({ N, pi: lastPi });
    }
  }
  function drawAnim() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
    for (let y = GAP; y < H; y += GAP) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (const nd of needles) {
      ctx.strokeStyle = nd.hit ? C.red : C.deep;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(nd.x1, nd.y1); ctx.lineTo(nd.x2, nd.y2); ctx.stroke();
    }
    ctx.fillStyle = C.ink;
    ctx.font = 'bold 18px Georgia, serif'; ctx.textAlign = 'left';
    ctx.fillText(`投针 ${N} 根　相交 ${hits} 根`, 24, 36);
    if (lastPi !== null) {
      ctx.fillStyle = C.deep;
      ctx.font = 'bold 26px Georgia, serif';
      ctx.fillText(`π ≈ ${lastPi.toFixed(4)}`, 24, 70);
    }
    ctx.fillStyle = C.sub;
    ctx.font = '14px Georgia, serif';
    ctx.fillText('红 = 与平行线相交，绿 = 未相交', 24, H - 20);
  }
  function drawChart() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const padL = 70, padR = 40, padT = 80, padB = 60;
    const cw = W - padL - padR, ch = H - padT - padB;
    const yMax = 4.0, yMin = 2.5;
    const toY = v => padT + ch - ((v - yMin) / (yMax - yMin)) * ch;

    ctx.strokeStyle = C.muted; ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
      const y = padT + (i / 4) * ch;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
    }
    ctx.strokeStyle = C.sub; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ch);
    ctx.lineTo(padL + cw, padT + ch); ctx.stroke();
    ctx.fillStyle = C.sub; ctx.font = '13px Georgia, serif';
    ctx.textAlign = 'right';
    for (let v = 2.5; v <= 4.0; v += 0.5) {
      ctx.fillText(v.toFixed(1), padL - 10, toY(v) + 4);
    }
    ctx.textAlign = 'left';
    ctx.fillText('π 估算值', padL - 55, padT - 20);
    ctx.textAlign = 'center';
    ctx.fillText('投针总数 N', padL + cw / 2, padT + ch + 30);
    const piY = toY(Math.PI);
    ctx.strokeStyle = C.accent; ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, piY); ctx.lineTo(padL + cw, piY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.sub; ctx.fillText('π = 3.14159', padL + cw - 60, piY - 8);

    const display = state.chartDisplay.buffon;
    if (display === 'current') {
      if (series.length > 1) {
        ctx.strokeStyle = C.deep; ctx.lineWidth = 2.2;
        ctx.beginPath();
        const maxN = series[series.length - 1].N;
        let started = false;
        for (const p of series) {
          if (p.pi === null) continue;
          const x = padL + (p.N / maxN) * cw;
          const y = toY(p.pi);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      if (lastPi !== null) {
        const maxN = Math.max(1, series.length ? series[series.length - 1].N : N);
        const x = padL + (N / maxN) * cw;
        const y = toY(lastPi);
        ctx.fillStyle = C.accent;
        ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = C.deep; ctx.lineWidth = 1.5; ctx.stroke();
      }
    } else {
      const h = state.history[parseInt(display)];
      if (h && h.piSeries && h.piSeries.length > 1) {
        ctx.strokeStyle = C.deep; ctx.lineWidth = 2.4;
        ctx.beginPath();
        const maxN = h.piSeries[h.piSeries.length - 1].N;
        let started = false;
        for (const p of h.piSeries) {
          if (p.pi === null) continue;
          const x = padL + (p.N / maxN) * cw;
          const y = toY(p.pi);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
        const last = h.piSeries[h.piSeries.length - 1];
        const x = padL + cw;
        const y = toY(last.pi);
        ctx.fillStyle = C.accent;
        ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
      }
    }

    ctx.fillStyle = C.ink; ctx.font = 'bold 16px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText('π 估算收敛曲线', padL, padT - 50);
    ctx.font = '13px Georgia, serif'; ctx.fillStyle = C.sub;
    if (display === 'current') {
      ctx.fillText(`N = ${N}，相交 = ${hits}，比值 l/d = ${ratio.toFixed(2)}`, padL, padT - 30);
    } else {
      const h = state.history[parseInt(display)];
      if (h) ctx.fillText(`历史记录：${h.label}（${h.stats['总投针数']} 根，π = ${h.stats['π 估算']}）`, padL, padT - 30);
    }
  }
  function hover(x, y) {
    let best = null, bestD = 12;
    for (const nd of needles) {
      const mx = (nd.x1 + nd.x2) / 2, my = (nd.y1 + nd.y2) / 2;
      const d = Math.hypot(mx - x, my - y);
      if (d < bestD) { bestD = d; best = nd; }
    }
    if (best) return `第 ${best.n} 根针<br>比值 ${best.ratio.toFixed(2)}<br>${best.hit ? '<b style="color:#ffb0a0">与线相交</b>' : '未相交'}`;
    return null;
  }
  function controls() {
    const rec = state.recording.buffon;
    return rec
      ? `<button class="danger" data-act="end">结束本次模拟</button>
         <button class="ghost" data-act="run1">投 1 根</button>
         <button class="ghost" data-act="run100">投 100 根</button>
         <button data-act="run1000">投 1000 根</button>
         <button data-act="run5000">投 5000 根</button>
         <button data-act="run10000">投 10000 根</button>
         <button class="ghost" data-act="custom">自定义…</button>`
      : `<button data-act="start">开始模拟</button>
         <button class="ghost" data-act="reset">重置</button>`;
  }
  async function onControl(act) {
    if (act === 'reset') { state.recording.buffon = false; reset(); return true; }
    if (act === 'start') {
      const r = await askNumber({
        title: '设置本次模拟参数',
        desc: '本次模拟中，针长与平行线间距的比值 l/d：',
        def: ratio.toFixed(2), min: 0.1, max: 0.9, step: 0.05,
        hint: '取值范围 0.1 ~ 0.9，例如 0.5',
      });
      if (r === null) return false;
      ratio = r; reset(); state.recording.buffon = true;
      state.chartDisplay.buffon = 'current';
      return true;
    }
    if (act === 'end') { state.recording.buffon = false; pushHistory(); return true; }
    if (act === 'custom') {
      const r = await askNumber({
        title: '输入投针次数', desc: '本次要投多少根针？',
        def: 500, min: 1, max: 100000, step: 1, hint: '1 ~ 100000',
      });
      if (r === null) return false;
      throwBatch(Math.round(r)); return true;
    }
    if (act === 'run1') { stepAnim(1); return true; }
    if (act === 'run100') { stepAnim(100); return true; }
    if (act === 'run1000') { throwBatch(1000); return true; }
    if (act === 'run5000') { throwBatch(5000); return true; }
    if (act === 'run10000') { throwBatch(10000); return true; }
    return false;
  }
  function snapshot() {
    return {
      type: 'buffon', label: `比值 ${ratio.toFixed(2)}`,
      piSeries: series.map(p => ({ N: p.N, pi: p.pi })),
      stats: {
        '总投针数': N, '相交数': hits,
        'π 估算': lastPi === null ? '—' : lastPi.toFixed(4),
      },
    };
  }
  return { reset, updateAnim, drawAnim, drawChart, hover, controls, onControl, snapshot,
    redraw() { state.view === 'chart' ? drawChart() : drawAnim(); } };
})();

/* ============================================================
   2. 高尔顿钉板
   ============================================================ */
const galton = (() => {
  let rows = 10;
  let slots = [];
  let falling = [];
  let total = 0;

  function layout() {
    const topPad = 70, botPad = 150;
    const rowGap = (H - topPad - botPad) / rows;
    const slotCount = rows + 1;
    const slotGap = W / slotCount;
    return { topPad, rowGap, slotGap, slotCount };
  }
  function reset() {
    const { slotCount } = layout();
    slots = Array.from({ length: slotCount }, () => []);
    falling = []; total = 0;
  }
  function addBall() {
    falling.push({ row: 0, x: W / 2, slot: 0, t: 0 });
    total++;
  }
  function stepAnim(k) { for (let i = 0; i < k; i++) addBall(); }
  function batch(k) {
    const { slotCount } = layout();
    if (!Array.isArray(slots) || slots.length !== slotCount) reset();
    for (let i = 0; i < k; i++) {
      let slot = 0;
      for (let r = 0; r < rows; r++) if (Math.random() < 0.5) slot++;
      slots[slot].push(true);
      total++;
    }
  }
  function updateAnim() {
    if (!Array.isArray(slots) || slots.length === 0) reset();
    const { rowGap, slotGap } = layout();
    for (let i = falling.length - 1; i >= 0; i--) {
      const b = falling[i];
      b.t += 0.09;
      if (b.t >= 1) {
        b.t = 0; b.row++;
        if (Math.random() < 0.5) { b.slot++; b.x += slotGap / 2; }
        else { b.x -= slotGap / 2; }
        if (b.row >= rows) {
          if (!slots[b.slot]) slots[b.slot] = [];
          slots[b.slot].push(true);
          falling.splice(i, 1);
        }
      }
    }
  }
  function perLayer(totalInSlot) {
    if (totalInSlot <= 60) return 1;
    if (totalInSlot <= 200) return 2;
    if (totalInSlot <= 600) return 5;
    if (totalInSlot <= 2000) return 10;
    return Math.ceil(totalInSlot / 200);
  }
  function drawAnim() {
    if (!Array.isArray(slots) || slots.length === 0) reset();
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const { topPad, rowGap, slotGap, slotCount } = layout();
    ctx.fillStyle = C.muted;
    for (let r = 0; r < rows; r++) {
      const y = topPad + r * rowGap;
      const numPegs = r + 1;
      const startX = (W - (numPegs - 1) * slotGap) / 2;
      for (let i = 0; i < numPegs; i++) {
        ctx.beginPath();
        ctx.arc(startX + i * slotGap, y, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    const barBase = H - 40;
    const maxAvailableHeight = barBase - topPad - 30;
    const maxSlotCount = Math.max(1, ...slots.map(s => s.length));
    const unit = perLayer(maxSlotCount);
    for (let s = 0; s < slotCount; s++) {
      const cx = slotGap * (s + 0.5);
      const arr = slots[s] || [];
      if (arr.length === 0) continue;
      const layers = Math.ceil(arr.length / unit);
      const layerH = Math.min(7, maxAvailableHeight / Math.max(layers, 1));
      for (let k = 0; k < layers; k++) {
        const y = barBase - (k + 0.5) * layerH;
        ctx.fillStyle = C.accent;
        ctx.beginPath();
        ctx.arc(cx, y, Math.min(slotGap * 0.34, layerH * 0.45), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.strokeStyle = C.muted;
    for (let s = 0; s <= slotCount; s++) {
      ctx.beginPath();
      ctx.moveTo(slotGap * s, H - 50);
      ctx.lineTo(slotGap * s, H - 10);
      ctx.stroke();
    }
    ctx.fillStyle = C.deep;
    for (const b of falling) {
      const y = topPad + b.row * rowGap + b.t * rowGap;
      ctx.beginPath();
      ctx.arc(b.x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = C.ink;
    ctx.font = 'bold 18px Georgia, serif'; ctx.textAlign = 'left';
    ctx.fillText(`层数 ${rows}　总球数 ${total}`, 24, 36);
    ctx.fillStyle = C.sub;
    ctx.font = '14px Georgia, serif';
    ctx.fillText(`小球堆积：每 ${unit} 个球合并为 1 层显示`, 24, 60);
  }
  function drawChart() {
    if (!Array.isArray(slots) || slots.length === 0) reset();
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const padL = 90, padR = 40, padT = 90, padB = 70;
    const cw = W - padL - padR, ch = H - padT - padB;

    const display = state.chartDisplay.galton;
    let counts, displayRows, displayTotal, displayLabel;
    if (display === 'current') {
      counts = slots.map(s => s.length);
      displayRows = rows;
      displayTotal = total;
      displayLabel = '当前模拟';
    } else {
      const h = state.history[parseInt(display)];
      if (h && h.counts) {
        counts = h.counts;
        displayRows = h.rows || (counts.length - 1);
        displayTotal = h.stats['总球数'];
        displayLabel = `历史记录 · ${h.label}`;
      } else {
        counts = slots.map(s => s.length);
        displayRows = rows;
        displayTotal = total;
        displayLabel = '当前模拟';
      }
    }
    const slotCount = counts.length;
    const maxCount = Math.max(1, ...counts);

    ctx.strokeStyle = C.muted; ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
      const y = padT + (i / 4) * ch;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
    }
    ctx.fillStyle = C.sub; ctx.font = '13px Georgia, serif';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const v = Math.round(maxCount * (1 - i / 4));
      const y = padT + (i / 4) * ch;
      ctx.fillText(v, padL - 10, y + 4);
    }
    ctx.textAlign = 'left';
    ctx.fillText('球数', padL - 44, padT - 30);

    ctx.strokeStyle = C.sub; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ch);
    ctx.lineTo(padL + cw, padT + ch); ctx.stroke();

    const barW = cw / slotCount * 0.72;
    for (let i = 0; i < slotCount; i++) {
      const x = padL + (i + 0.5) * (cw / slotCount);
      const h = (counts[i] / maxCount) * ch;
      ctx.fillStyle = C.deep;
      ctx.fillRect(x - barW / 2, padT + ch - h, barW, h);
      if (counts[i] > 0) {
        ctx.fillStyle = C.ink;
        ctx.font = 'bold 12px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.fillText(counts[i], x, padT + ch - h - 6);
      }
      ctx.fillStyle = C.sub;
      ctx.font = '11px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(i, x, padT + ch + 18);
    }
    ctx.fillStyle = C.sub; ctx.font = '13px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('槽位编号', padL + cw / 2, padT + ch + 42);

    const mean = displayRows / 2, std = Math.sqrt(displayRows) / 2;
    const totalArea = counts.reduce((a, b) => a + b, 0);
    const binW = cw / slotCount;
    ctx.strokeStyle = C.accent; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = 0; px <= cw; px++) {
      const k = (px / cw) * displayRows;
      const pdf = Math.exp(-((k - mean) ** 2) / (2 * std * std)) / (std * Math.sqrt(2 * Math.PI));
      const scaled = pdf * totalArea * binW;
      const y = padT + ch - (scaled / maxCount) * ch;
      if (px === 0) ctx.moveTo(padL + px, y); else ctx.lineTo(padL + px, y);
    }
    ctx.stroke();

    ctx.fillStyle = C.ink; ctx.font = 'bold 16px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${displayLabel} · 每槽球数直方图（共 ${displayTotal} 球）`, padL, padT - 50);
    ctx.font = '13px Georgia, serif';
    ctx.fillStyle = C.sub;
    ctx.fillText('X 轴：槽位编号（0 起）　Y 轴：该槽球数', padL, padT - 28);
    ctx.fillStyle = C.accent;
    ctx.fillText('橙线：理论正态分布 N(n/2, n/4)', padL + cw - 240, padT - 28);
  }
  function hover(x, y) {
    if (!Array.isArray(slots) || slots.length === 0) return null;
    const { topPad, rowGap, slotGap, slotCount } = layout();
    for (const b of falling) {
      const by = topPad + b.row * rowGap + b.t * rowGap;
      if (Math.hypot(b.x - x, by - y) < 10) {
        return `下落中<br>第 ${b.row} 层，槽位 ${b.slot}`;
      }
    }
    const s = Math.floor(x / slotGap);
    if (s >= 0 && s < slotCount && y > H - 50) {
      const c = (slots[s] || []).length;
      const pct = total ? (c / total * 100).toFixed(1) : 0;
      return `槽位 ${s}<br>球数 ${c}（${pct}%）`;
    }
    return null;
  }
  function controls() {
    const rec = state.recording.galton;
    return rec
      ? `<button class="danger" data-act="end">结束本次模拟</button>
         <button class="ghost" data-act="drop1">投 1 球</button>
         <button class="ghost" data-act="drop100">投 100 球</button>
         <button data-act="drop1000">投 1000 球</button>
         <button data-act="drop5000">投 5000 球</button>
         <button data-act="drop10000">投 10000 球</button>
         <button class="ghost" data-act="custom">自定义…</button>`
      : `<button data-act="start">开始模拟</button>
         <button class="ghost" data-act="reset">重置</button>`;
  }
  async function onControl(act) {
    if (act === 'reset') { state.recording.galton = false; reset(); return true; }
    if (act === 'start') {
      const r = await askNumber({
        title: '设置本次模拟参数', desc: '本次模拟中钉板的层数：',
        def: rows, min: 4, max: 14, step: 1, hint: '4 ~ 14',
      });
      if (r === null) return false;
      rows = Math.round(r); reset(); state.recording.galton = true;
      state.chartDisplay.galton = 'current';
      return true;
    }
    if (act === 'end') { state.recording.galton = false; pushHistory(); return true; }
    if (act === 'custom') {
      const r = await askNumber({
        title: '输入投球次数', desc: '本次要投多少球？',
        def: 500, min: 1, max: 100000, step: 1, hint: '1 ~ 100000',
      });
      if (r === null) return false;
      batch(Math.round(r)); return true;
    }
    if (act === 'drop1') { stepAnim(1); return true; }
    if (act === 'drop100') { stepAnim(100); return true; }
    if (act === 'drop1000') { batch(1000); return true; }
    if (act === 'drop5000') { batch(5000); return true; }
    if (act === 'drop10000') { batch(10000); return true; }
    return false;
  }
  function snapshot() {
    const counts = slots.map(s => s.length);
    return {
      type: 'galton', label: `${rows} 层`, counts, rows,
      stats: { '层数': rows, '总球数': total },
    };
  }
  return { reset, updateAnim, drawAnim, drawChart, hover, controls, onControl, snapshot,
    redraw() { state.view === 'chart' ? drawChart() : drawAnim(); } };
})();

/* ============================================================
   3. 生日问题 —— 上下两图
   ============================================================ */
const birthday = (() => {
  const DAYS = 365;
  let n = 23;
  let trials = 0, successes = 0;
  let lastBirthdays = [];
  let lastHasDup = false;
  let lastDupDay = null;
  let animCount = 0;
  let scanResults = [];
  // 累计的每日出现次数（多次试验累加）
  let dayFreq = new Array(DAYS + 1).fill(0);
  // 当前/历史展示的 dayFreq（用于下半图）
  let dayFreqSnapshot = null;
  const MAX_N = 400;

  function reset() {
    trials = 0; successes = 0;
    lastBirthdays = []; lastHasDup = false; lastDupDay = null;
    animCount = 0;
    dayFreq = new Array(DAYS + 1).fill(0);
  }
  function theory(k) {
    if (k > DAYS) return 1;
    let p = 1;
    for (let i = 0; i < k; i++) p *= (DAYS - i) / DAYS;
    return 1 - p;
  }
  function trialOne(k) {
    const seen = new Set();
    const list = [];
    let dup = false;
    let dupDay = null;
    for (let i = 0; i < k; i++) {
      const d = randInt(DAYS) + 1;
      list.push(d);
      if (seen.has(d)) {
        dup = true;
        if (dupDay === null) dupDay = d;
      }
      seen.add(d);
    }
    return { list, dup, dupDay };
  }
  function runOnceAnim() {
    const { list, dup, dupDay } = trialOne(n);
    trials++; if (dup) successes++;
    lastBirthdays = list; lastHasDup = dup; lastDupDay = dupDay;
    animCount = 0;
    for (const d of list) dayFreq[d]++;
  }
  function runBatch(k) {
    for (let i = 0; i < k; i++) {
      const { list, dup } = trialOne(n);
      trials++; if (dup) successes++;
      for (const d of list) dayFreq[d]++;
    }
    const { list, dup, dupDay } = trialOne(n);
    lastBirthdays = list; lastHasDup = dup; lastDupDay = dupDay;
    animCount = list.length;
  }
  function scanAll() {
    scanResults = [];
    for (let k = 2; k <= 80; k++) {
      let succ = 0;
      for (let t = 0; t < 300; t++) if (trialOne(k).dup) succ++;
      scanResults.push({ n: k, p: succ / 300 });
    }
  }
  function updateAnim() { if (animCount < lastBirthdays.length) animCount += 1; }
  function drawAnim() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const cols = 73, rows = 5;
    const padX = 50, padY = 100;
    const cellW = (W - padX * 2) / cols;
    const cellH = (H - padY - 70) / rows;
    const countMap = {};
    for (let i = 0; i < animCount; i++) {
      const d = lastBirthdays[i];
      countMap[d] = (countMap[d] || 0) + 1;
    }
    const dupDays = new Set();
    for (const d in countMap) if (countMap[d] >= 2) dupDays.add(+d);

    for (let i = 0; i < DAYS; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      const x = padX + c * cellW, y = padY + r * cellH;
      const cnt = countMap[i + 1] || 0;
      if (cnt >= 2) ctx.fillStyle = C.red;
      else if (cnt === 1) ctx.fillStyle = C.deep;
      else ctx.fillStyle = C.bg2;
      ctx.fillRect(x + 1, y + 1, cellW - 2, cellH - 2);
      if (cnt >= 2) {
        ctx.strokeStyle = C.warm;
        ctx.lineWidth = 1.2;
        ctx.strokeRect(x + 0.5, y + 0.5, cellW - 1, cellH - 1);
      }
    }
    ctx.fillStyle = C.ink;
    ctx.font = 'bold 18px Georgia, serif'; ctx.textAlign = 'left';
    ctx.fillText(`班级人数 ${n}　当前 n 累计试验 ${trials} 次`, padX, 40);
    ctx.font = '15px Georgia, serif'; ctx.fillStyle = C.sub;
    ctx.fillText(`正在演示第 ${animCount} / ${lastBirthdays.length} 人的生日`, padX, 66);
    if (animCount === lastBirthdays.length && lastBirthdays.length > 0) {
      if (lastHasDup) {
        ctx.fillStyle = C.red;
        ctx.font = 'bold 16px Georgia, serif';
        const dayList = [...dupDays].slice(0, 5).join('、');
        const more = dupDays.size > 5 ? ` 等 ${dupDays.size} 天` : '';
        ctx.fillText(`本次模拟：出现重复生日（第 ${dayList}${more}）`, padX, H - 30);
      } else {
        ctx.fillStyle = C.deep;
        ctx.font = 'bold 16px Georgia, serif';
        ctx.fillText('本次模拟：没有重复生日', padX, H - 30);
      }
    }
    ctx.fillStyle = C.sub; ctx.font = '13px Georgia, serif';
    ctx.fillText('每格代表一天　深绿 = 1 人　砖红 = 2 人及以上（金色描边 = 特殊日）', padX, H - 10);
  }

  // ===== 统计图表：上下两图 =====
  function drawChart() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const padL = 70, padR = 50, padT = 60, padB = 40;

    // ---- 上半图：概率曲线 ----
    const topH = (H - padT - padB) * 0.58;
    const cw = W - padL - padR;
    const ch = topH;

    ctx.strokeStyle = C.muted; ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
      const y = padT + (i / 4) * ch;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
    }
    for (let i = 0; i <= 8; i++) {
      const x = padL + (i / 8) * cw;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ch); ctx.stroke();
    }
    ctx.strokeStyle = C.sub; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ch);
    ctx.lineTo(padL + cw, padT + ch); ctx.stroke();
    ctx.fillStyle = C.sub; ctx.font = '12px Georgia, serif';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      ctx.fillText((i / 4).toFixed(2), padL - 8, padT + ch - (i / 4) * ch + 4);
    }
    ctx.textAlign = 'center';
    for (let i = 0; i <= 8; i++) {
      ctx.fillText(Math.round(i * MAX_N / 8), padL + (i / 8) * cw, padT + ch + 18);
    }
    ctx.fillStyle = C.text; ctx.font = 'bold 13px Georgia, serif';
    ctx.fillText('班级人数 n', padL + cw / 2, padT + ch + 38);
    ctx.save();
    ctx.translate(padL - 46, padT + ch / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('至少两人同生日的概率', 0, 0);
    ctx.restore();

    // 理论曲线
    ctx.strokeStyle = C.deep; ctx.lineWidth = 2.6;
    ctx.beginPath();
    for (let i = 2; i <= 80; i++) {
      const x = padL + ((i - 2) / (MAX_N - 2)) * cw;
      const y = padT + ch - theory(i) * ch;
      if (i === 2) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 扫描曲线
    if (scanResults.length > 0) {
      ctx.strokeStyle = C.accent; ctx.lineWidth = 2;
      ctx.beginPath();
      scanResults.forEach((p, i) => {
        const x = padL + ((p.n - 2) / (MAX_N - 2)) * cw;
        const y = padT + ch - p.p * ch;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    // 均值点
    const display = state.chartDisplay.birthday;
    let displayN, displayP, displayHasDup, displayDupDay, displayTrials, displayLabel;
    if (display === 'current') {
      displayN = n; displayP = trials >= 1 ? successes / trials : null;
      displayHasDup = lastHasDup; displayDupDay = lastDupDay;
      displayTrials = trials; displayLabel = '当前模拟';
    } else {
      const h = state.history[parseInt(display)];
      if (h) {
        displayN = h.currentN; displayP = h.currentP;
        displayHasDup = h.lastHasDup; displayDupDay = h.lastDupDay;
        displayTrials = h.stats['当前 n 试验次数']; displayLabel = `历史 · n=${h.currentN}`;
      }
    }
    if (displayN && displayN <= MAX_N && displayP !== null) {
      const x = padL + ((displayN - 2) / (MAX_N - 2)) * cw;
      const y = padT + ch - displayP * ch;
      if (displayHasDup) {
        ctx.fillStyle = 'rgba(168,112,92,.35)';
        ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = displayHasDup ? C.red : C.sage;
      ctx.beginPath(); ctx.arc(x, y, displayHasDup ? 9 : 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = displayHasDup ? C.warm : C.bg;
      ctx.lineWidth = displayHasDup ? 3 : 2;
      ctx.stroke();
      ctx.fillStyle = displayHasDup ? C.red : C.sub;
      ctx.font = displayHasDup ? 'bold 12px Georgia, serif' : '12px Georgia, serif';
      ctx.textAlign = 'left';
      const tx = Math.min(x + 12, padL + cw - 200);
      const label = displayHasDup
        ? `本批有重复${displayDupDay ? '（第 ' + displayDupDay + ' 天）' : ''} · ${displayTrials} 次`
        : `本批无重复 · ${displayTrials} 次`;
      ctx.fillText(label, tx, y - 10);
    }

    ctx.fillStyle = C.ink; ctx.font = 'bold 15px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${displayLabel} · 至少两人同生日的概率`, padL, padT - 30);
    let lx = padL;
    ctx.font = '12px Georgia, serif';
    ctx.fillStyle = C.deep;
    ctx.fillRect(lx, padT - 12, 12, 3);
    ctx.fillStyle = C.sub;
    ctx.fillText('理论值', lx + 18, padT - 6);
    lx += 80;
    ctx.fillStyle = C.accent;
    ctx.fillRect(lx, padT - 12, 12, 3);
    ctx.fillStyle = C.sub;
    ctx.fillText('扫描 n=2..80', lx + 18, padT - 6);

    // ---- 下半图：365 天频率柱状图 ----
    const botT = padT + ch + 60;
    const botH = H - botT - padB;

    // 选择数据源
    let freq = dayFreq;
    let freqLabel = '当前模拟累计';
    if (display !== 'current') {
      const h = state.history[parseInt(display)];
      if (h && h.dayFreq) { freq = h.dayFreq; freqLabel = '历史记录'; }
      else { freq = dayFreq; freqLabel = '当前模拟累计'; }
    }
    const maxFreq = Math.max(1, ...freq);
    const barW = cw / DAYS;

    ctx.strokeStyle = C.muted; ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
      const y = botT + (i / 4) * botH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
    }
    ctx.strokeStyle = C.sub; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, botT); ctx.lineTo(padL, botT + botH);
    ctx.lineTo(padL + cw, botT + botH); ctx.stroke();

    // Y 轴刻度
    ctx.fillStyle = C.sub; ctx.font = '12px Georgia, serif';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const v = Math.round(maxFreq * (1 - i / 4));
      const y = botT + (i / 4) * botH;
      ctx.fillText(v, padL - 8, y + 4);
    }
    ctx.textAlign = 'center';
    for (let i = 0; i <= 6; i++) {
      const d = Math.round(i * 365 / 6);
      const x = padL + (i / 6) * cw;
      ctx.fillText(d, x, botT + botH + 16);
    }
    ctx.fillStyle = C.text; ctx.font = 'bold 13px Georgia, serif';
    ctx.fillText('天（1 ~ 365）', padL + cw / 2, botT + botH + 36);
    ctx.save();
    ctx.translate(padL - 46, botT + botH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('出现次数', 0, 0);
    ctx.restore();

    // 柱子
    for (let d = 1; d <= DAYS; d++) {
      const x = padL + (d - 0.5) * barW;
      const h = (freq[d] / maxFreq) * botH;
      if (freq[d] >= 2) ctx.fillStyle = C.red;
      else if (freq[d] === 1) ctx.fillStyle = C.deep;
      else ctx.fillStyle = C.bg2;
      ctx.fillRect(x - barW * 0.45, botT + botH - h, Math.max(1, barW * 0.9), h);
    }

    ctx.fillStyle = C.ink; ctx.font = 'bold 15px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${freqLabel} · 365 天出现次数分布（重复的天用砖红高亮）`, padL, botT - 12);
  }

  function hover(x, y) {
    const cols = 73, rows = 5;
    const padX = 50, padY = 100;
    const cellW = (W - padX * 2) / cols;
    const cellH = (H - padY - 70) / rows;
    const c = Math.floor((x - padX) / cellW);
    const r = Math.floor((y - padY) / cellH);
    if (c < 0 || c >= cols || r < 0 || r >= rows) return null;
    const day = r * cols + c + 1;
    if (day > DAYS) return null;
    const cnt = lastBirthdays.slice(0, animCount).filter(d => d === day).length;
    const special = cnt >= 2 ? '<br><b style="color:#ffb0a0">特殊日：多人同生日</b>' : '';
    return `第 ${day} 天<br>本次 ${cnt} 人过生日${special}`;
  }
  function controls() {
    const rec = state.recording.birthday;
    return rec
      ? `<button class="danger" data-act="end">结束本次模拟</button>
         <button class="ghost" data-act="run1">模拟 1 次</button>
         <button class="ghost" data-act="run10">模拟 10 次</button>
         <button data-act="run100">模拟 100 次</button>
         <button data-act="run1000">模拟 1000 次</button>
         <button class="ghost" data-act="custom">自定义…</button>
         <button class="ghost" data-act="scan">扫描 n=2..80</button>`
      : `<button data-act="start">开始模拟</button>
         <button class="ghost" data-act="reset">重置</button>`;
  }
  async function onControl(act) {
    if (act === 'reset') { state.recording.birthday = false; reset(); return true; }
    if (act === 'start') {
      const r = await askNumber({
        title: '设置本次模拟参数', desc: '本次模拟的班级人数 n：',
        def: n, min: 2, max: 365, step: 1, hint: '2 ~ 365',
      });
      if (r === null) return false;
      n = Math.round(r); reset(); state.recording.birthday = true;
      state.chartDisplay.birthday = 'current';
      return true;
    }
    if (act === 'end') { state.recording.birthday = false; pushHistory(); return true; }
    if (act === 'scan') { scanAll(); return true; }
    if (act === 'custom') {
      const r = await askNumber({
        title: '输入模拟次数', desc: `在当前 n=${n} 下模拟多少次？`,
        def: 200, min: 1, max: 100000, step: 1, hint: '1 ~ 100000',
      });
      if (r === null) return false;
      runBatch(Math.round(r)); return true;
    }
    if (act === 'run1') { runOnceAnim(); return true; }
    if (act === 'run10') { runBatch(10); return true; }
    if (act === 'run100') { runBatch(100); return true; }
    if (act === 'run1000') { runBatch(1000); return true; }
    return false;
  }
  function snapshot() {
    return {
      type: 'birthday', label: `n=${n}`,
      scanResults: scanResults.map(p => ({ n: p.n, p: p.p })),
      currentN: n,
      currentP: trials >= 1 ? successes / trials : null,
      lastHasDup,
      lastDupDay,
      // 关键：把 365 天频率一起存档
      dayFreq: dayFreq.slice(),
      stats: {
        '当前 n': n,
        '当前 n 模拟概率': trials ? ((successes / trials) * 100).toFixed(2) + '%' : '—',
        '当前 n 理论概率': (theory(n) * 100).toFixed(2) + '%',
        '当前 n 试验次数': trials,
        '本批出现过重复': lastHasDup ? '是' : '否',
      },
    };
  }
  return { reset, updateAnim, drawAnim, drawChart, hover, controls, onControl, snapshot,
    redraw() { state.view === 'chart' ? drawChart() : drawAnim(); } };
})();

/* ============================================================
   4. 分房问题 —— 上下两图
   ============================================================ */
const matching = (() => {
  let n = 10;
  let trials = 0, successes = 0;
  let lastAssign = [], lastFixed = [], animCount = 0;
  let lastFixedCount = 0;
  let fixedCountDist = {};   // k -> 次数
  const MAX_N = 200;

  function reset() {
    trials = 0; successes = 0;
    lastAssign = []; lastFixed = []; animCount = 0;
    lastFixedCount = 0;
    fixedCountDist = {};
  }
  function trialOne() {
    const arr = Array.from({ length: n }, (_, i) => i + 1);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    const fixed = arr.map((v, i) => v === i + 1);
    return { arr, fixed, fixedCount: fixed.filter(Boolean).length };
  }
  function runOnceAnim() {
    const { arr, fixed, fixedCount } = trialOne();
    trials++; if (fixedCount > 0) successes++;
    fixedCountDist[fixedCount] = (fixedCountDist[fixedCount] || 0) + 1;
    lastAssign = arr; lastFixed = fixed; lastFixedCount = fixedCount;
    animCount = 0;
  }
  function runBatch(k) {
    for (let i = 0; i < k; i++) {
      const { fixedCount } = trialOne();
      trials++; if (fixedCount > 0) successes++;
      fixedCountDist[fixedCount] = (fixedCountDist[fixedCount] || 0) + 1;
    }
    const { arr, fixed, fixedCount } = trialOne();
    lastAssign = arr; lastFixed = fixed; lastFixedCount = fixedCount;
    animCount = arr.length;
  }
  function updateAnim() { if (animCount < lastAssign.length) animCount += 1; }
  function theory() { return 1 - Math.exp(-1); }
  function drawAnim() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    if (lastAssign.length === 0) {
      ctx.fillStyle = C.sub; ctx.font = '18px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('点击下方「开始模拟」开始', W / 2, H / 2);
      return;
    }
    const padX = 120, padY = 100;
    const rowH = Math.min(36, (H - padY - 80) / n);
    const personX = padX, roomX = W - padX;
    ctx.font = '15px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.sub;
    ctx.fillText('人', personX, padY - 36);
    ctx.fillText('房间', roomX, padY - 36);
    for (let i = 0; i < n; i++) {
      const y = padY + i * rowH;
      const shown = i < animCount;
      const fixed = shown && lastFixed[i];
      if (fixed) {
        ctx.fillStyle = C.red;
        ctx.font = 'bold 17px Georgia, serif';
      } else {
        ctx.fillStyle = shown ? C.text : C.muted;
        ctx.font = '15px Georgia, serif';
      }
      ctx.fillText(`#${i + 1}`, personX, y);
      ctx.fillText(shown ? `#${lastAssign[i]}` : '?', roomX, y);
      if (shown) {
        ctx.strokeStyle = fixed ? C.red : C.muted;
        ctx.lineWidth = fixed ? 3 : 1;
        ctx.beginPath();
        ctx.moveTo(personX + 28, y); ctx.lineTo(roomX - 28, y); ctx.stroke();
        if (fixed) {
          ctx.fillStyle = C.warm;
          ctx.beginPath();
          ctx.arc((personX + roomX) / 2, y, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.ink; ctx.font = 'bold 18px Georgia, serif';
    ctx.fillText(`人数 ${n}　累计试验 ${trials} 次`, 30, 44);
    ctx.font = '15px Georgia, serif'; ctx.fillStyle = C.sub;
    ctx.fillText(`已分配 ${animCount} / ${n} 人`, 30, 70);
    if (animCount === lastAssign.length && animCount > 0) {
      if (lastFixedCount > 0) {
        ctx.fillStyle = C.red;
        ctx.font = 'bold 17px Georgia, serif';
        const fixedList = lastFixed.map((v, i) => v ? `#${i + 1}` : null).filter(Boolean).join('、');
        ctx.fillText(`本次模拟：${lastFixedCount} 人分到自己房间（${fixedList}）`, 30, H - 24);
      } else {
        ctx.fillStyle = C.sage;
        ctx.font = '15px Georgia, serif';
        ctx.fillText('本次模拟：没有人分到自己房间', 30, H - 24);
      }
    }
  }
  function drawChart() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const padL = 70, padR = 50, padT = 60, padB = 40;

    // ---- 上半图：概率曲线 ----
    const topH = (H - padT - padB) * 0.55;
    const cw = W - padL - padR;
    const ch = topH;

    ctx.strokeStyle = C.muted; ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
      const y = padT + (i / 4) * ch;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
    }
    for (let i = 0; i <= 5; i++) {
      const x = padL + (i / 5) * cw;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ch); ctx.stroke();
    }
    ctx.strokeStyle = C.sub; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + ch);
    ctx.lineTo(padL + cw, padT + ch); ctx.stroke();
    ctx.fillStyle = C.sub; ctx.font = '12px Georgia, serif';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      ctx.fillText((i / 4).toFixed(2), padL - 8, padT + ch - (i / 4) * ch + 4);
    }
    ctx.textAlign = 'center';
    for (let i = 0; i <= 5; i++) {
      ctx.fillText(Math.round(i * MAX_N / 5), padL + (i / 5) * cw, padT + ch + 18);
    }
    ctx.fillStyle = C.text; ctx.font = 'bold 13px Georgia, serif';
    ctx.fillText('人数 n', padL + cw / 2, padT + ch + 38);
    ctx.save();
    ctx.translate(padL - 46, padT + ch / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('至少一人分到自己房间的概率', 0, 0);
    ctx.restore();

    ctx.strokeStyle = C.deep; ctx.lineWidth = 2.6;
    ctx.beginPath();
    for (let i = 1; i <= MAX_N; i++) {
      const x = padL + ((i - 1) / (MAX_N - 1)) * cw;
      const y = padT + ch - theory() * ch;
      if (i === 1) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    const display = state.chartDisplay.matching;
    let displayN, displayP, displayHasFixed, displayFixedCount, displayTrials, displayLabel;
    if (display === 'current') {
      displayN = n; displayP = trials >= 1 ? successes / trials : null;
      displayHasFixed = lastFixedCount > 0; displayFixedCount = lastFixedCount;
      displayTrials = trials; displayLabel = '当前模拟';
    } else {
      const h = state.history[parseInt(display)];
      if (h) {
        displayN = h.currentN; displayP = h.currentP;
        displayHasFixed = h.lastFixedCount > 0; displayFixedCount = h.lastFixedCount;
        displayTrials = h.stats['试验次数']; displayLabel = `历史 · n=${h.currentN}`;
      }
    }
    if (displayN && displayN <= MAX_N && displayP !== null) {
      const x = padL + ((displayN - 1) / (MAX_N - 1)) * cw;
      const y = padT + ch - displayP * ch;
      if (displayHasFixed) {
        ctx.fillStyle = 'rgba(232,184,142,.40)';
        ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = displayHasFixed ? C.accent : C.sage;
      ctx.beginPath(); ctx.arc(x, y, displayHasFixed ? 9 : 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = displayHasFixed ? C.warm : C.bg;
      ctx.lineWidth = displayHasFixed ? 3 : 2;
      ctx.stroke();
      ctx.fillStyle = displayHasFixed ? C.red : C.sub;
      ctx.font = displayHasFixed ? 'bold 12px Georgia, serif' : '12px Georgia, serif';
      ctx.textAlign = 'left';
      const tx = Math.min(x + 12, padL + cw - 240);
      const label = displayHasFixed
        ? `本批有 ${displayFixedCount} 人分到自己房间 · ${displayTrials} 次`
        : `本批无人分到自己房间 · ${displayTrials} 次`;
      ctx.fillText(label, tx, y - 10);
    }

    ctx.fillStyle = C.ink; ctx.font = 'bold 15px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${displayLabel} · 至少一人分到自己房间的概率`, padL, padT - 30);
    let lx = padL;
    ctx.font = '12px Georgia, serif';
    ctx.fillStyle = C.deep;
    ctx.fillRect(lx, padT - 12, 12, 3);
    ctx.fillStyle = C.sub;
    ctx.fillText('理论值 1 − 1/e', lx + 18, padT - 6);

    // ---- 下半图：固定点个数 k 的分布 ----
    const botT = padT + ch + 60;
    const botH = H - botT - padB;

    // 数据源
    let dist = fixedCountDist;
    let distLabel = '当前模拟累计';
    if (display !== 'current') {
      const h = state.history[parseInt(display)];
      if (h && h.fixedCountDist) { dist = h.fixedCountDist; distLabel = '历史记录'; }
      else { dist = fixedCountDist; distLabel = '当前模拟累计'; }
    }
    const maxK = Math.min(Math.max(n, 6), 8);   // k 到 8 即可
    let maxP = 0.01;
    for (let k = 0; k <= maxK; k++) {
      const c = dist[k] || 0;
      const p = c / Math.max(1, displayTrials);
      if (p > maxP) maxP = p;
    }
    const slotCount = maxK + 1;

    ctx.strokeStyle = C.muted; ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
      const y = botT + (i / 4) * botH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + cw, y); ctx.stroke();
    }
    ctx.strokeStyle = C.sub; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, botT); ctx.lineTo(padL, botT + botH);
    ctx.lineTo(padL + cw, botT + botH); ctx.stroke();

    ctx.fillStyle = C.sub; ctx.font = '12px Georgia, serif';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const v = (maxP * (1 - i / 4) * 100).toFixed(0);
      const y = botT + (i / 4) * botH;
      ctx.fillText(v + '%', padL - 8, y + 4);
    }
    ctx.textAlign = 'center';
    const barW = cw / slotCount * 0.6;
    for (let k = 0; k <= maxK; k++) {
      const x = padL + (k + 0.5) * (cw / slotCount);
      const c = dist[k] || 0;
      const p = c / Math.max(1, displayTrials);
      const h = (p / maxP) * botH;
      if (c > 0) {
        ctx.fillStyle = k === 0 ? C.sage : C.accent;
        ctx.fillRect(x - barW / 2, botT + botH - h, barW, h);
        ctx.fillStyle = C.ink;
        ctx.font = 'bold 11px Georgia, serif';
        ctx.textAlign = 'center';
        ctx.fillText(c, x, botT + botH - h - 6);
      }
      ctx.fillStyle = C.sub;
      ctx.font = '12px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(k, x, botT + botH + 16);
    }
    ctx.fillStyle = C.text; ctx.font = 'bold 13px Georgia, serif';
    ctx.fillText('固定点个数 k（k 人分到自己房间）', padL + cw / 2, botT + botH + 36);
    ctx.save();
    ctx.translate(padL - 46, botT + botH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('频率', 0, 0);
    ctx.restore();

    ctx.fillStyle = C.ink; ctx.font = 'bold 15px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${distLabel} · 固定点个数分布（k = 0 用灰绿，k ≥ 1 用暖橙）`, padL, botT - 12);
  }
  function hover(x, y) {
    if (lastAssign.length === 0) return null;
    const padY = 100;
    const rowH = Math.min(36, (H - padY - 80) / n);
    const i = Math.floor((y - padY + rowH / 2) / rowH);
    if (i < 0 || i >= n || i >= animCount) return null;
    const fixed = lastFixed[i];
    return `第 ${i + 1} 个人<br>被分到房间 #${lastAssign[i]}<br>${fixed ? '<b style="color:#ffb0a0">正是自己的房间</b>' : '不是自己的房间'}`;
  }
  function controls() {
    const rec = state.recording.matching;
    return rec
      ? `<button class="danger" data-act="end">结束本次模拟</button>
         <button class="ghost" data-act="run1">模拟 1 次</button>
         <button class="ghost" data-act="run10">模拟 10 次</button>
         <button data-act="run100">模拟 100 次</button>
         <button data-act="run1000">模拟 1000 次</button>
         <button class="ghost" data-act="custom">自定义…</button>`
      : `<button data-act="start">开始模拟</button>
         <button class="ghost" data-act="reset">重置</button>`;
  }
  async function onControl(act) {
    if (act === 'reset') { state.recording.matching = false; reset(); return true; }
    if (act === 'start') {
      const r = await askNumber({
        title: '设置本次模拟参数', desc: '本次分房问题模拟的人数 n：',
        def: n, min: 3, max: 200, step: 1, hint: '3 ~ 200',
      });
      if (r === null) return false;
      n = Math.round(r); reset(); state.recording.matching = true;
      state.chartDisplay.matching = 'current';
      return true;
    }
    if (act === 'end') { state.recording.matching = false; pushHistory(); return true; }
    if (act === 'custom') {
      const r = await askNumber({
        title: '输入模拟次数', desc: `在当前 n=${n} 下模拟多少次？`,
        def: 200, min: 1, max: 100000, step: 1, hint: '1 ~ 100000',
      });
      if (r === null) return false;
      runBatch(Math.round(r)); return true;
    }
    if (act === 'run1') { runOnceAnim(); return true; }
    if (act === 'run10') { runBatch(10); return true; }
    if (act === 'run100') { runBatch(100); return true; }
    if (act === 'run1000') { runBatch(1000); return true; }
    return false;
  }
  function snapshot() {
    return {
      type: 'matching', label: `${n} 人`,
      currentN: n,
      currentP: trials >= 1 ? successes / trials : null,
      lastFixedCount,
      fixedCountDist: Object.assign({}, fixedCountDist),
      stats: {
        '人数': n,
        '模拟概率': trials ? ((successes / trials) * 100).toFixed(2) + '%' : '—',
        '理论概率': (theory() * 100).toFixed(2) + '%',
        '试验次数': trials,
        '本批固定点': lastFixedCount > 0 ? `${lastFixedCount} 人` : '无',
      },
    };
  }
  return { reset, updateAnim, drawAnim, drawChart, hover, controls, onControl, snapshot,
    redraw() { state.view === 'chart' ? drawChart() : drawAnim(); } };
})();

/* ============================================================
   注册表
   ============================================================ */
const sim = { buffon, galton, birthday, matching };

/* ============================================================
   标签 / 视图
   ============================================================ */
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.tab = tab.dataset.tab;
    state.view = 'anim';
    $$('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === 'anim'));
    $('#compareOverlay').classList.remove('active');
    $('#chartHistoryBar').classList.remove('active');
    renderControls();
    renderHistory();
    sim[state.tab].redraw();
  });
});
$$('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.view = btn.dataset.view;
    if (state.view === 'compare') {
      $('#chartHistoryBar').classList.remove('active');
      renderCompare();
    } else {
      $('#compareOverlay').classList.remove('active');
      renderChartHistoryBar();
      sim[state.tab].redraw();
    }
  });
});

/* ============================================================
   统计图表上方历史切换条
   ============================================================ */
function renderChartHistoryBar() {
  const bar = $('#chartHistoryBar');
  if (state.view !== 'chart') { bar.classList.remove('active'); bar.innerHTML = ''; return; }
  const visible = currentTabHistoryIndices();
  if (visible.length === 0) { bar.classList.remove('active'); bar.innerHTML = ''; return; }
  bar.classList.add('active');
  const cur = state.chartDisplay[state.tab];
  let html = `<button class="chart-hist-btn${cur === 'current' ? ' active' : ''}" data-show="current">当前模拟</button>`;
  visible.slice().reverse().forEach((realIdx, idx) => {
    const h = state.history[realIdx];
    const label = `历史${idx + 1} · ${h.label}`;
    html += `<button class="chart-hist-btn${cur === String(realIdx) ? ' active' : ''}" data-show="${realIdx}">${label}</button>`;
  });
  bar.innerHTML = html;
  bar.querySelectorAll('.chart-hist-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.chartDisplay[state.tab] = btn.dataset.show;
      renderChartHistoryBar();
      sim[state.tab].redraw();
    });
  });
}

/* ============================================================
   控制条
   ============================================================ */
function renderControls() {
  $('#controls').innerHTML = sim[state.tab].controls();
}
$('#controls').addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act;
  if (!act) return;
  const ok = await sim[state.tab].onControl(act);
  if (ok) {
    sim[state.tab].redraw();
    renderControls();
    renderChartHistoryBar();
    if (act !== 'end' && !state.recording[state.tab]) pushHistory();
  }
});

/* ============================================================
   鼠标悬停
   ============================================================ */
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const html = sim[state.tab].hover(x, y);
  if (html) showTooltip(x, y, html); else hideTooltip();
});
canvas.addEventListener('mouseleave', hideTooltip);

/* ============================================================
   历史记录
   ============================================================ */
function currentTabHistoryIndices() {
  const arr = [];
  state.history.forEach((h, i) => { if (h.type === state.tab) arr.push(i); });
  return arr;
}
function pushHistory() {
  const snap = sim[state.tab].snapshot();
  const empty = Object.values(snap.stats).every(v => v === '—' || v === 0);
  if (empty) return;
  state.history.push(snap);
  renderHistory();
  renderChartHistoryBar();
}
function renderHistory() {
  const box = $('#history');
  const visibleIndices = currentTabHistoryIndices();
  $('#historyCount').textContent = `${visibleIndices.length} 条`;
  const allSelected = visibleIndices.length > 0 && visibleIndices.every(i => state.selected.includes(i));
  $('#chkSelectAll').checked = allSelected;

  if (visibleIndices.length === 0) {
    box.innerHTML = '<div id="historyEmpty">当前题目还没有历史记录。<br>点击下方「开始模拟」来创建一次吧。</div>';
    return;
  }
  const ordered = visibleIndices.slice().reverse();
  box.innerHTML = ordered.map(realIdx => {
    const h = state.history[realIdx];
    const checked = state.selected.includes(realIdx) ? ' checked' : '';
    const selected = state.selected.includes(realIdx) ? ' selected' : '';
    let trialCount = 0;
    if (h.type === 'buffon') trialCount = h.stats['总投针数'];
    else if (h.type === 'galton') trialCount = h.stats['总球数'];
    else if (h.type === 'birthday') trialCount = h.stats['当前 n 试验次数'];
    else if (h.type === 'matching') trialCount = h.stats['试验次数'];
    const rows = Object.entries(h.stats).map(([k, v]) => {
      let cls = '';
      if (k === '本批出现过重复' || k === '本批固定点') {
        cls = (v === '是' || v !== '无') ? 'special-yes' : 'special-no';
      }
      return `<div class="h-row"><span>${k}</span><span class="${cls}">${v}</span></div>`;
    }).join('');
    return `<label class="h-item${selected}">
      <input type="checkbox" data-idx="${realIdx}"${checked}>
      <div class="h-body">
        <div class="h-title">${h.label}<span class="h-badge">${trialCount} 次</span></div>
        ${rows}
      </div>
    </label>`;
  }).join('');

  box.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const i = parseInt(cb.dataset.idx);
      const pos = state.selected.indexOf(i);
      if (cb.checked && pos < 0) state.selected.push(i);
      if (!cb.checked && pos >= 0) state.selected.splice(pos, 1);
      cb.closest('.h-item').classList.toggle('selected', cb.checked);
      const vis = currentTabHistoryIndices();
      $('#chkSelectAll').checked = vis.length > 0 && vis.every(k => state.selected.includes(k));
      if (state.view === 'chart') {
        renderChartHistoryBar();
        sim[state.tab].redraw();
      }
      if (state.view === 'compare') renderCompare();
    });
  });
}
$('#chkSelectAll').addEventListener('change', e => {
  const vis = currentTabHistoryIndices();
  if (e.target.checked) {
    vis.forEach(i => { if (!state.selected.includes(i)) state.selected.push(i); });
  } else {
    state.selected = state.selected.filter(i => !vis.includes(i));
  }
  renderHistory();
  if (state.view === 'chart') { renderChartHistoryBar(); sim[state.tab].redraw(); }
  if (state.view === 'compare') renderCompare();
});
$('#btnClearHistory').addEventListener('click', () => {
  const vis = currentTabHistoryIndices();
  const toDelete = new Set(vis);
  const newHistory = [];
  const newSelected = [];
  const oldToNew = new Map();
  state.history.forEach((h, i) => {
    if (!toDelete.has(i)) {
      oldToNew.set(i, newHistory.length);
      newHistory.push(h);
    }
  });
  state.selected.forEach(i => { if (oldToNew.has(i)) newSelected.push(oldToNew.get(i)); });
  state.history = newHistory;
  state.selected = newSelected;
  state.chartDisplay[state.tab] = 'current';
  renderHistory();
  renderChartHistoryBar();
  if (state.view === 'chart') sim[state.tab].redraw();
  if (state.view === 'compare') renderCompare();
});

/* ============================================================
   对比视图
   ============================================================ */
function renderCompare() {
  const overlay = $('#compareOverlay');
  const hint = $('#compareHint');
  const grid = $('#compareGrid');
  const visibleIndices = currentTabHistoryIndices().filter(i => state.selected.includes(i));

  if (visibleIndices.length === 0) {
    hint.style.display = 'flex';
    hint.textContent = '在右侧历史记录中勾选条目后，这里会并排显示对比。';
    grid.innerHTML = '';
    grid.style.display = 'none';
  } else {
    hint.style.display = 'none';
    grid.style.display = 'grid';
    const cols = Math.min(visibleIndices.length, 6);
    grid.className = 'cols-' + cols;

    const cards = visibleIndices.map((realIdx, idx) => {
      const h = state.history[realIdx];
      const color = CHART_COLORS[idx % CHART_COLORS.length];
      let trialCount = 0;
      if (h.type === 'buffon') trialCount = h.stats['总投针数'];
      else if (h.type === 'galton') trialCount = h.stats['总球数'];
      else if (h.type === 'birthday') trialCount = h.stats['当前 n 试验次数'];
      else if (h.type === 'matching') trialCount = h.stats['试验次数'];
      const rows = Object.entries(h.stats).map(([k, v]) => {
        let tag = '';
        if (k === '本批出现过重复') {
          tag = v === '是' ? '<span class="tag yes">有重复</span>' : '<span class="tag no">无</span>';
        } else if (k === '本批固定点') {
          tag = v === '无' ? '<span class="tag no">无</span>' : `<span class="tag yes">${v}</span>`;
        }
        return `<div><span style="color:#7a6f5c">${k}：</span><b style="color:${color}">${v}</b>${tag}</div>`;
      }).join('');
      return `<div class="cmp-card" style="border-top-color:${color}">
        <h4><span class="badge" style="background:${color}">${idx + 1}</span>${h.label}<span class="count-badge">${trialCount} 次</span></h4>
        <div class="cmp-canvas-wrap"><canvas></canvas></div>
        <div class="cmp-stats">${rows}</div>
      </div>`;
    }).join('');
    grid.innerHTML = cards;
    requestAnimationFrame(() => {
      grid.querySelectorAll('.cmp-card').forEach((card, idx) => {
        const cv = card.querySelector('canvas');
        const realIdx = visibleIndices[idx];
        drawMiniChart(cv, state.history[realIdx], CHART_COLORS[idx % CHART_COLORS.length]);
      });
    });
  }
  overlay.classList.add('active');
}

function drawMiniChart(cv, h, color) {
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  cv.width = Math.max(1, rect.width * dpr);
  cv.height = Math.max(1, rect.height * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cw = rect.width, ch = rect.height;
  c.fillStyle = C.bg;
  c.fillRect(0, 0, cw, ch);
  if (cw < 10 || ch < 10) return;

  if (h.type === 'galton' && h.counts) {
    const maxC = Math.max(1, ...h.counts);
    const barW = cw / h.counts.length * 0.7;
    c.fillStyle = color;
    for (let i = 0; i < h.counts.length; i++) {
      const x = (i + 0.5) * (cw / h.counts.length);
      const bh = (h.counts[i] / maxC) * ch * 0.88;
      c.fillRect(x - barW / 2, ch - bh, barW, bh);
    }
  } else if (h.type === 'buffon' && h.piSeries && h.piSeries.length > 1) {
    const yMin = 2.5, yMax = 4.0;
    const toY = v => ch - ((v - yMin) / (yMax - yMin)) * ch;
    c.strokeStyle = C.muted;
    c.setLineDash([4, 3]);
    c.beginPath(); c.moveTo(0, toY(Math.PI)); c.lineTo(cw, toY(Math.PI)); c.stroke();
    c.setLineDash([]);
    c.strokeStyle = color; c.lineWidth = 2;
    c.beginPath();
    const maxN = h.piSeries[h.piSeries.length - 1].N;
    let started = false;
    h.piSeries.forEach(p => {
      if (p.pi === null) return;
      const x = (p.N / maxN) * cw;
      const y = toY(p.pi);
      if (!started) { c.moveTo(x, y); started = true; } else c.lineTo(x, y);
    });
    c.stroke();
  } else if (h.type === 'birthday') {
    const maxN = 400;
    const theory = k => { if (k > 365) return 1; let p = 1; for (let i = 0; i < k; i++) p *= (365 - i) / 365; return 1 - p; };
    c.strokeStyle = C.deep; c.lineWidth = 1.5;
    c.beginPath();
    for (let i = 2; i <= 80; i++) {
      const x = ((i - 2) / (maxN - 2)) * cw;
      const y = ch - theory(i) * ch;
      if (i === 2) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
    if (h.currentN && h.currentP !== null && h.currentP !== undefined && h.currentN <= maxN) {
      const x = ((h.currentN - 2) / (maxN - 2)) * cw;
      const y = ch - h.currentP * ch;
      const hasDup = h.lastHasDup;
      if (hasDup) {
        c.fillStyle = 'rgba(168,112,92,.35)';
        c.beginPath(); c.arc(x, y, 10, 0, Math.PI * 2); c.fill();
      }
      c.fillStyle = hasDup ? C.red : C.sage;
      c.beginPath(); c.arc(x, y, hasDup ? 6 : 4, 0, Math.PI * 2); c.fill();
    }
  } else if (h.type === 'matching') {
    const maxN = 200;
    const y0 = ch - (1 - Math.exp(-1)) * ch;
    c.strokeStyle = C.deep; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(0, y0); c.lineTo(cw, y0); c.stroke();
    if (h.currentN && h.currentP !== null && h.currentP !== undefined && h.currentN <= maxN) {
      const x = ((h.currentN - 1) / (maxN - 1)) * cw;
      const y = ch - h.currentP * ch;
      const hasFixed = h.lastFixedCount > 0;
      if (hasFixed) {
        c.fillStyle = 'rgba(232,184,142,.40)';
        c.beginPath(); c.arc(x, y, 10, 0, Math.PI * 2); c.fill();
      }
      c.fillStyle = hasFixed ? C.accent : C.sage;
      c.beginPath(); c.arc(x, y, hasFixed ? 6 : 4, 0, Math.PI * 2); c.fill();
    }
  } else {
    c.fillStyle = C.sub;
    c.font = '13px Georgia, serif';
    c.textAlign = 'center';
    c.fillText('暂无可视化', cw / 2, ch / 2);
  }
}
window.addEventListener('resize', () => {
  if (state.view === 'compare' && $('#compareOverlay').classList.contains('active')) {
    renderCompare();
  }
});

/* ============================================================
   引导
   ============================================================ */
const guideSteps = [
  { title: '欢迎使用统计模拟器', text: '这是一个用随机模拟演示经典概率问题的工具，包含蒲丰投针、高尔顿钉板、生日问题、分房问题。' },
  { title: '顶部标签：切换题目', text: '点击顶部标签切换题目。切换时视图自动回到「过程动画」。不同题目历史互不干扰，切换回来不会丢。' },
  { title: '视图切换', text: '「过程动画」显示随机过程；「统计图表」显示上下两张图：上曲线+下柱状；「对比视图」并排显示勾选的历史记录。' },
  { title: '开始一次模拟', text: '点击「开始模拟」，弹窗填写本次模拟参数。程序按你输入的值开始新的模拟。' },
  { title: '模拟期间可多次点击', text: '开始后，下方按钮变成多个步长选项。可多次点击，所有点击累加到同一次模拟中。' },
  { title: '结束本次模拟', text: '点击「结束本次模拟」，累计结果写入右侧历史记录。' },
  { title: '统计图表：上下两图', text: '统计图表里，上半部分是概率曲线（均值点），下半部分：生日问题显示 365 天出现次数分布（重复的天用砖红高亮），分房问题显示固定点个数 k 的分布。' },
  { title: '历史切换与对比', text: '画布上方有一排切换按钮，可单独查看"当前模拟"或某条历史记录。右侧勾选后可在「对比视图」并排比较。' },
];
let guideIdx = 0;
function renderGuide() {
  const s = guideSteps[guideIdx];
  $('#guideStepLabel').textContent = `STEP ${guideIdx + 1} / ${guideSteps.length}`;
  $('#guideTitle').textContent = s.title;
  $('#guideText').innerHTML = s.text;
  $('#guideNext').textContent = guideIdx === guideSteps.length - 1 ? '开始使用' : '下一步';
}
$('#guideNext').addEventListener('click', () => {
  if (guideIdx < guideSteps.length - 1) { guideIdx++; renderGuide(); }
  else $('#guideMask').classList.add('hidden');
});
$('#guideSkip').addEventListener('click', () => $('#guideMask').classList.add('hidden'));

/* ============================================================
   主循环
   ============================================================ */
function loop() {
  if (state.view === 'anim') {
    sim[state.tab].updateAnim();
    sim[state.tab].drawAnim();
  }
  requestAnimationFrame(loop);
}

/* ============================================================
   初始化
   ============================================================ */
function init() {
  resizeCanvas();
  galton.reset();
  renderControls();
  renderHistory();
  renderChartHistoryBar();
  renderGuide();
  sim.buffon.redraw();
  loop();
}
init();
